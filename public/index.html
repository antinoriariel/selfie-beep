<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Selfie Beep</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
      --ok: #3fb950; --bad: #f85149; --warn: #d29922; --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; gap: 14px; padding: 16px;
      max-width: 560px; margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.15rem; margin: 0; display: flex; align-items: center; justify-content: space-between; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #04121f; white-space: nowrap;
    }
    button.danger { background: var(--bad); color: #fff; }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 600;
      padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
    .status.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .status.wait .dot { background: var(--warn); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }

    #pad {
      flex: 1; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 6px; user-select: none; transition: background .12s, border-color .12s;
    }
    #pad.flash { background: #1f3a26; border-color: var(--ok); }
    #pad.flash-bad { background: #3a1f1f; border-color: var(--bad); }
    #count { font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: .85rem; }

    #log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto;
           font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #log li { padding: 3px 0; border-bottom: 1px dashed var(--border); animation: in .2s ease-out; }
    #log li.fade { opacity: 0; transition: opacity .6s; }
    #log .t { color: var(--muted); }
    #log .k { color: var(--accent); font-weight: 700; }
    #log .ok { color: var(--ok); }
    #log .bad { color: var(--bad); }
    @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  </style>
</head>
<body>
  <h1>
    Selfie Beep
    <span id="status" class="status"><span class="dot"></span><span id="statusText">Desconectado</span></span>
  </h1>

  <div class="panel">
    <div class="row">
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="wss://api.poloit.com.ar">
      <button id="toggle">Conectar</button>
    </div>
  </div>

  <div id="pad" class="panel" tabindex="0">
    <div id="count">0</div>
    <div>Presioná el botón del selfie stick</div>
    <div class="hint">Si no responde, tocá acá para darle foco a la página</div>
  </div>

  <div class="panel">
    <ul id="log"></ul>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const urlInput = $('url'), toggleBtn = $('toggle'), statusEl = $('status'), statusText = $('statusText');
  const pad = $('pad'), countEl = $('count'), logEl = $('log');

  const STORAGE_KEY = 'selfie-beep-url-v2'; // v2: el WS ahora vive en el mismo host/puerto que la página
  const LOG_MAX = 20, LOG_TTL_MS = 15000;
  const wsScheme = location.protocol === 'https:' ? 'wss://' : 'ws://'; // https no permite ws:// (contenido mixto)
  const defaultUrl = wsScheme + (location.host || 'localhost:3000');

  let ws = null;
  let manualClose = false;
  let reconnectTimer = null;
  let retries = 0;
  let count = 0;

  try { urlInput.value = localStorage.getItem(STORAGE_KEY) || defaultUrl; } catch { urlInput.value = defaultUrl; }

  // ---------------- Estado visual ----------------
  function setStatus(state, text) {
    statusEl.className = 'status' + (state === 'ok' ? ' ok' : state === 'wait' ? ' wait' : '');
    statusText.textContent = text;
    const active = state !== 'off';
    toggleBtn.textContent = active ? 'Desconectar' : 'Conectar';
    toggleBtn.classList.toggle('danger', active);
  }

  function addLog(html) {
    const li = document.createElement('li');
    const t = new Date().toLocaleTimeString('es-AR', { hour12: false });
    li.innerHTML = `<span class="t">${t}</span> ${html}`;
    logEl.prepend(li);
    while (logEl.children.length > LOG_MAX) logEl.lastChild.remove();
    setTimeout(() => { li.classList.add('fade'); setTimeout(() => li.remove(), 600); }, LOG_TTL_MS);
  }

  function flash(ok) {
    const cls = ok ? 'flash' : 'flash-bad';
    pad.classList.add(cls);
    setTimeout(() => pad.classList.remove(cls), 150);
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------------- WebSocket ----------------
  function connect() {
    clearTimeout(reconnectTimer);
    let url = urlInput.value.trim();
    if (!url) return;
    if (!/^wss?:\/\//i.test(url)) url = wsScheme + url;          // permite escribir solo "api.poloit.com.ar" o "192.168.0.10:3000"
    urlInput.value = url;
    try { localStorage.setItem(STORAGE_KEY, url); } catch {}

    manualClose = false;
    setStatus('wait', retries ? `Reconectando (${retries})…` : 'Conectando…');

    try {
      ws = new WebSocket(url);
    } catch (err) {
      addLog(`<span class="bad">URL inválida: ${esc(err.message)}</span>`);
      setStatus('off', 'Desconectado');
      return;
    }

    ws.onopen = () => {
      retries = 0;
      setStatus('ok', 'Conectado');
      addLog(`<span class="ok">Conectado a ${esc(url)}</span>`);
      pad.focus();
    };

    ws.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'ack') flash(true);
      } catch {}
    };

    ws.onclose = () => {
      ws = null;
      if (manualClose) {
        setStatus('off', 'Desconectado');
        addLog('Desconectado');
        return;
      }
      // Reconexión automática con backoff exponencial (1s, 2s, 4s… máx 10s)
      retries++;
      const delay = Math.min(1000 * 2 ** (retries - 1), 10000);
      setStatus('wait', `Reconectando en ${Math.round(delay / 1000)}s…`);
      reconnectTimer = setTimeout(connect, delay);
    };

    ws.onerror = () => { /* onclose se encarga */ };
  }

  function disconnect() {
    manualClose = true;
    retries = 0;
    clearTimeout(reconnectTimer);
    if (ws) ws.close(1000, 'Cierre manual');
    else setStatus('off', 'Desconectado');
  }

  toggleBtn.addEventListener('click', () => {
    if (ws || reconnectTimer && !manualClose && statusEl.classList.contains('wait')) disconnect();
    else connect();
  });

  // Con la pantalla apagada Android pausa la página y no llegan teclas: la mantenemos encendida
  async function keepAwake() {
    if (!('wakeLock' in navigator)) return addLog('<span class="bad">Este navegador no puede mantener la pantalla encendida</span>');
    try { await navigator.wakeLock.request('screen'); } catch (err) { addLog(`<span class="bad">Wake Lock: ${esc(err.message)}</span>`); }
  }

  // Al volver a la pestaña (p. ej. después de bloquear el celular), reconectar enseguida
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake(); // el sistema libera el lock al ocultarse la página
    if (document.visibilityState === 'visible' && !ws && !manualClose && reconnectTimer) {
      retries = 0;
      connect();
    }
  });

  // ---------------- Captura global de teclas ----------------
  window.addEventListener('keydown', (e) => {
    // Dejar escribir normalmente en el campo de URL (Enter = conectar)
    if (e.target === urlInput) {
      if (e.key === 'Enter') { e.preventDefault(); connect(); }
      return;
    }

    e.preventDefault();
    e.stopPropagation();
    if (e.repeat) return; // mantener apretado no dispara ráfagas

    const label = e.key === ' ' ? 'Space' : (e.key || e.code || `keyCode ${e.keyCode}`);
    count++;
    countEl.textContent = count;

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('BEEP');
      addLog(`<span class="k">${esc(label)}</span> <span class="t">(${esc(e.code || '—')})</span> → BEEP`);
    } else {
      flash(false);
      addLog(`<span class="k">${esc(label)}</span> <span class="bad">sin conexión, no enviado</span>`);
    }
  }, { capture: true });

  // Tocar la zona central le devuelve el foco a la página
  pad.addEventListener('pointerdown', () => pad.focus());

  setStatus('off', 'Desconectado');
  keepAwake();
  connect(); // intenta conectar al abrir
})();
</script>
</body>
</html>
